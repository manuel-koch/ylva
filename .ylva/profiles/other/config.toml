default_engine = "openrouterB"

[compaction]
timeout_sec = 600

[provider_connections.ollama-local]
provider = "ollama"
api_base_url = "http://localhost:11434"

[provider_connections.ollama-cloud]
provider = "ollama"
api_base_url = "https://ollama.com"
api_key = "${OLLAMA_CLOUD_API_KEY}"

[provider_connections.openrouter]
provider = "openrouter"
api_base_url = "https://openrouter.ai"
api_key = "${OPENROUTER_API_KEY}"

[engines.local]
provider_connection = "ollama-local"
model = "gemma4:e4b-mlx"
context_length = "96K"
compact_target_ratio = 0.4
soft_compaction_threshold = 0.5
hard_compaction_threshold = 0.8

[engines.openrouterA]
provider_connection = "openrouter"
model = "deepseek/deepseek-v4-flash-0731"
context_length = "256K"
reasoning = "max"

[engines.openrouterB]
provider_connection = "openrouter"
model = "openai/gpt-6-luna"
context_length = "256K"
reasoning = "medium"

[tools.read]
rules = [
    { rule = "skill_sidecar", verdict = "auto_approved" },
]

[web_search]
backend = "${YLVA_WEB_SEARCH_BACKEND}"

[web_search.backends.searxng]
base_url = "${SEARXNG_BASE_URL}"

[web_search.backends.brave]
api_key = "${BRAVE_API_KEY}"

[tools.web_search]
rules = [
    { rule = "network_request", verdict = "auto_approved" },
]

[tools.bash]
rules = [
    { command = ["true"],         verdict = "auto_approved" },
    { command = ["false"],        verdict = "auto_approved" },
    { command = ["ls", "**"],     verdict = "auto_approved" },
    { command = ["grep", "**"],   verdict = "auto_approved" },
    { command = ["wc", "**"],     verdict = "auto_approved" },
    { command = ["nl", "**"],     verdict = "auto_approved" },
    { command = ["cat", "**"],    verdict = "auto_approved" },
    { command = ["cut", "**"],    verdict = "auto_approved" },
    { command = ["head", "**"],   verdict = "auto_approved" },
    { command = ["tail", "**"],   verdict = "auto_approved" },
    { command = ["tr", "**"],     verdict = "auto_approved" },
    { command = ["echo", "**"],   verdict = "auto_approved" },
    { command = ["printf", "**"], verdict = "auto_approved" },
    { command = ["test", "**"],   verdict = "auto_approved" },
]
