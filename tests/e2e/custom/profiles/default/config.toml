#default_engine = "ollama/local"
default_engine = "openrouter-dense"

[compaction]
engine = "ollama/local"
timeout_sec = 600

[provider_connections.ollama-local]
provider = "ollama"
api_base_url = "http://localhost:11434"

[provider_connections.ollama-cloud]
provider = "ollama"
api_base_url = "https://ollama.com"
api_key = "${OLLAMA_CLOUD_API_KEY}"

[provider_connections.openrouter]
provider = "openrouter"
api_base_url = "https://openrouter.ai"
api_key = "${OPENROUTER_API_KEY}"

[engines."ollama/local"]
provider_connection = "ollama-local"
model = "gemma4:e4b-mlx"
context_length = "32kb"
compact_target_ratio = 0.4
soft_compaction_threshold = 0.5
hard_compaction_threshold = 0.8

[engines.local-llm]
provider_connection = "ollama-local"
model = "gemma4:e4b-mlx"

[engines.broken-local-discovery]
provider_connection = "ollama-local"
model = "invalid"

[engines."ollama/cloud"]
provider_connection = "ollama-cloud"
model = "gemma4:31b-cloud"

[engines.openrouter]
provider_connection = "openrouter"
model = "deepseek/deepseek-v4-flash-0731"
context_length = "265kb"
reasoning = "max"

[engines.openrouter-dense]
provider_connection = "openrouter"
model = "openai/gpt-6-luna"
context_length = "96kb"
reasoning = "max"

[agents.local-discovery]
description = "An agent that can perform read-only discovery tasks in workspace solely using builtin tools and a local AI-Model."
engine = "local-llm"
allowed_tools = ["read", "glob", "search"]

#[agents.local-discovery.compaction]
#engine = "ollama/local"
#timeout_sec = 120

[web_search]
backend = "${YLVA_WEB_SEARCH_BACKEND}"

[web_search.backends.searxng]
base_url = "${SEARXNG_BASE_URL}"

[web_search.backends.brave]
api_key = "${BRAVE_API_KEY}"

[tools.web_search]
rules = [
    { rule = "network_request", verdict = "auto_approved" },
]

[tools.web_fetch]
rules = [
    { rule = "network_request", target = "https://github.com", verdict = "auto_approved" },
]
