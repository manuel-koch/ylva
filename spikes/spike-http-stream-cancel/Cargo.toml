[package]
name = "ylva-spike-http-stream-cancel"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "io-util", "net", "rt"] }
tokio-util = "0.7"
futures = "0.3"
reqwest = { version = "0.12", features = ["json", "stream"] }
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
