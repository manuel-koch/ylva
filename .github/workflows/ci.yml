name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # Push runs are redundant once the branch has an open PR; the PR run covers it.
  gate:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      run: ${{ steps.decide.outputs.run }}
    steps:
      - id: decide
        run: |
          if [ "${EVENT_NAME}" = "push" ]; then
            open_prs=$(gh pr list --repo "${REPO}" --head "${BRANCH_NAME}" --state open --json number --jq length)
            if [ "${open_prs}" != "0" ]; then
              echo "run=false" >> "${GITHUB_OUTPUT}"
              exit 0
            fi
          fi
          echo "run=true" >> "${GITHUB_OUTPUT}"
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
          REPO: ${{ github.repository }}
          BRANCH_NAME: ${{ github.ref_name }}

  conventions:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Branch name
        run: scripts/check-git-conventions.sh branch-name "${BRANCH_NAME}"
        env:
          BRANCH_NAME: ${{ github.head_ref || github.ref_name }}
      - name: Commit messages
        if: github.event_name == 'pull_request'
        run: scripts/check-git-conventions.sh commit-range "origin/${BASE_REF}..HEAD^2"
        env:
          BASE_REF: ${{ github.base_ref }}
      - name: Git convention script tests
        run: make test-git-conventions

  verify:
    needs: gate
    if: needs.gate.outputs.run == 'true'
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy, llvm-tools-preview
      - uses: Swatinem/rust-cache@v2
      - name: Install tools
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-llvm-cov,cargo-audit,rumdl
      - run: make format-check
      - run: make lint
      - run: make test-coverage
      - name: Detect dependency changes
        id: dependency_changes
        run: |
          base="${BASE_SHA:-${BEFORE_SHA}}"
          if [ -z "${base}" ] || echo "${base}" | grep -qE '^0+$' \
              || ! git diff --quiet "${base}" HEAD -- Cargo.toml Cargo.lock; then
            echo "changed=true" >> "${GITHUB_OUTPUT}"
          fi
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BEFORE_SHA: ${{ github.event.before }}
      - name: Dependency audit
        if: steps.dependency_changes.outputs.changed == 'true'
        run: make audit
