[package]
name = "ylva"
version = "0.26.4"
edition = "2021"
license = "Apache-2.0"
authors = ["Manuel Koch"]
repository = "https://github.com/manuel-koch/ylva"

[features]
# whether tool execution will be randomly prolonged by 3-5s
artificial-tool-delay = []

[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
debug = false

[dependencies]
base64 = "0.22"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
infer = { version = "0.22", default-features = false }
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
serde_json = { version = "1", features = ["preserve_order"] }
reqwest = { version = "0.12", features = ["json", "stream", "gzip"] }
eventsource-stream = "0.2"
serde = { version = "1", features = ["derive"] }
schemars = { version = "0.8", features = ["preserve_order"] }
glob = "0.3"
ignore = "0.4"
regex = "1"
similar = { version = "2", features = ["text"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
tracing-appender = "0.2"
tracing-log = "0.2"
ratatui = { version = "0.30", features = ["crossterm"] }
crossterm = "0.29"
ratatui-textarea = { version = "0.9", features = ["crossterm"] }
textwrap = "0.16"
syntect = { version = "5", default-features = false, features = ["default-syntaxes", "default-themes", "html", "dump-load", "regex-fancy"] }
arboard = "3"
jsonschema = { version = "0.17", default-features = false }
pulldown-cmark = { version = "0.13.4", default-features = false }
sha2 = "0.10"
dirs = "6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std", "serde"] }
toml = "1.1.5"
dotenvy = "0.15"
serde_yaml = "0.9"
tree-sitter = "0.25"
tree-sitter-bash = "0.25"
clap = { version = "4", features = ["derive"] }
scraper = "0.27.0"
tiktoken-rs = "0.5"
htmd = "0.5"
httpdate = "1"
flate2 = "1"
libc = "0.2"

[build-dependencies]
time = { version = "0.3", features = ["formatting", "macros"] }

[dev-dependencies]
log = "0.4"
tempfile = "3"
tokio = { version = "1", features = ["test-util"] }

[target.'cfg(unix)'.dependencies]
nix = { version = "0.29", features = ["signal", "process", "fs"] }
