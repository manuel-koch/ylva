[package]
name = "ylva"
version = "0.1.0"
edition = "2021"

[dependencies]
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
futures = "0.3"
thiserror = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
serde_json = "1"

[dev-dependencies]
tokio = { version = "1", features = ["test-util"] }